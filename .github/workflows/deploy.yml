name: Deploy

on:
  push:
    branches:
      - master

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3

      - name: Docker login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        run: |
          IMAGE=${{ secrets.REGISTRY_LOGIN_SERVER }}/prodeko-org/prodeko-org
          docker build . -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::7}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The Ansible deploy hangs indefinitely if the container on the VM
    # doesn't respond to docker stop; fail the job instead.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v3

      - name: Docker login to ACR
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Pull Ansible CI image
        run: docker pull ${{ secrets.REGISTRY_LOGIN_SERVER }}/infrastructure/prodeko-ci:v2

      - name: Deploy project
        uses: ./.github/workflows/deploy

      - name: Upload release to Sentry
        # Skipping this for now because sentry isn't running
        if: false
        uses: getsentry/action-release@v1
        env:
          SENTRY_URL: https://sentry.prodeko.org/
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: prodeko
          SENTRY_PROJECT: prodeko-org
        with:
          environment: production
